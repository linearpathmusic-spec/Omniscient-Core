name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
                  cache: pip
            - run: python -m pip install -e ".[pdf]" pytest pyright
            - run: python -m pytest tests -q
            - run: pyright
            - run: python -m compileall -q brain tools scripts tests
            - run: python tools/brain_lint.py
